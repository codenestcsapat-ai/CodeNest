<!doctype html>
<html lang="hu" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Új CodeNest megkeresés</title>
  <style>
    html, body { margin:0 !important; padding:0 !important; width:100% !important; }
    body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table, td { border-collapse:collapse; mso-table-lspace:0; mso-table-rspace:0; }
    img { border:0; height:auto; line-height:100%; outline:none; text-decoration:none; }
    @media only screen and (max-width:640px) {
      .outer-pad { padding:8px !important; }
      .shell { width:100% !important; max-width:100% !important; }
      .content-pad { padding-left:18px !important; padding-right:18px !important; }
      .header-pad { padding:18px !important; }
      .header-logo { width:210px !important; max-width:90% !important; }
      .title { font-size:22px !important; }
      .detail-label, .detail-value { display:block !important; width:auto !important; box-sizing:border-box !important; }
      .detail-label { padding:10px 14px 3px !important; border-bottom:0 !important; }
      .detail-value { padding:3px 14px 11px !important; }
      .message-box { padding:14px !important; }
      .reply-button { display:block !important; text-align:center !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background:#f3f6fb; color:#172033; font-family:'Segoe UI',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; background:#f3f6fb;">
    <tr>
      <td align="center" class="outer-pad" style="padding:20px 10px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="shell" style="width:100%; max-width:620px; background:#ffffff; border:1px solid #dfe6f1; border-radius:14px; overflow:hidden;">
          <tr>
            <td class="header-pad" style="padding:22px 28px; background:#246cf0;">
              <img src="https://codenest.hu/email-assets/codenest-logo-email.png" width="220" class="header-logo" alt="CodeNest" style="display:block; width:220px; max-width:100%; background:#ffffff; border-radius:8px; padding:7px 10px;">
            </td>
          </tr>
          <tr>
            <td class="content-pad" style="padding:28px 30px 12px;">
              <p style="margin:0 0 7px; color:#246cf0; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.7px;">Új weboldali érdeklődő</p>
              <h1 class="title" style="margin:0; color:#172033; font-size:25px; line-height:1.3; overflow-wrap:anywhere; word-break:break-word;">{{from_name}} üzenetet küldött</h1>
            </td>
          </tr>
          <tr>
            <td class="content-pad" style="padding:10px 30px 8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border:1px solid #dfe6f1; border-radius:10px;">
                <tr>
                  <td width="120" class="detail-label" style="width:120px; padding:13px 16px; border-bottom:1px solid #e8edf5; color:#667085; font-size:13px;">Név</td>
                  <td class="detail-value" style="padding:13px 16px; border-bottom:1px solid #e8edf5; color:#172033; font-size:14px; font-weight:700; overflow-wrap:anywhere; word-break:break-word;">{{from_name}}</td>
                </tr>
                <tr>
                  <td width="120" class="detail-label" style="width:120px; padding:13px 16px; border-bottom:1px solid #e8edf5; color:#667085; font-size:13px;">E-mail</td>
                  <td class="detail-value" style="padding:13px 16px; border-bottom:1px solid #e8edf5; font-size:14px; overflow-wrap:anywhere; word-break:break-word;"><a href="mailto:{{from_email}}" style="color:#246cf0; text-decoration:none; font-weight:700; overflow-wrap:anywhere; word-break:break-all;">{{from_email}}</a></td>
                </tr>
                <tr>
                  <td width="120" class="detail-label" style="width:120px; padding:13px 16px; color:#667085; font-size:13px;">Projekt</td>
                  <td class="detail-value" style="padding:13px 16px; color:#172033; font-size:14px; font-weight:700; overflow-wrap:anywhere; word-break:break-word;">{{project_label}}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td class="content-pad" style="padding:18px 30px 8px;">
              <p style="margin:0 0 8px; color:#667085; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;">Üzenet</p>
              <div class="message-box" style="padding:17px 18px; background:#f7f9fc; border-left:4px solid #246cf0; border-radius:7px; color:#172033; font-size:15px; line-height:1.65; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word;">{{message}}</div>
            </td>
          </tr>
          <tr>
            <td class="content-pad" style="padding:22px 30px 30px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td bgcolor="#246cf0" style="border-radius:9px;">
                    <a href="mailto:{{from_email}}?subject=Re%3A%20CodeNest%20megkeres%C3%A9s" class="reply-button" style="display:inline-block; padding:13px 20px; color:#ffffff; font-size:14px; font-weight:700; text-decoration:none;">Válasz az érdeklődőnek</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td class="content-pad" style="padding:16px 30px; background:#edf3ff; color:#667085; font-size:12px; line-height:1.5;">Ezt az értesítést a codenest.hu kapcsolatfelvételi űrlapja küldte.</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
