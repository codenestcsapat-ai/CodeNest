<!doctype html>
<html lang="hu" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Új CodeNest megkeresés</title>
</head>
<body style="margin:0; padding:0; background:#f3f6fb; color:#172033; font-family:'Segoe UI',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; background:#f3f6fb;">
    <tr>
      <td align="center" style="padding:20px 10px;">
        <table role="presentation" width="620" cellpadding="0" cellspacing="0" border="0" style="width:620px; max-width:100%; background:#ffffff; border:1px solid #dfe6f1; border-radius:14px; overflow:hidden;">
          <tr>
            <td style="padding:22px 28px; background:#246cf0;">
              <img src="https://codenest.hu/email-assets/codenest-logo-email.png" width="220" alt="CodeNest" style="display:block; width:220px; max-width:100%; background:#ffffff; border-radius:8px; padding:7px 10px;">
            </td>
          </tr>
          <tr>
            <td style="padding:28px 30px 12px;">
              <p style="margin:0 0 7px; color:#246cf0; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.7px;">Új weboldali érdeklődő</p>
              <h1 style="margin:0; color:#172033; font-size:25px; line-height:1.3;">{{from_name}} üzenetet küldött</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:10px 30px 8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border:1px solid #dfe6f1; border-radius:10px;">
                <tr>
                  <td style="padding:13px 16px; border-bottom:1px solid #e8edf5; color:#667085; font-size:13px; width:120px;">Név</td>
                  <td style="padding:13px 16px; border-bottom:1px solid #e8edf5; color:#172033; font-size:14px; font-weight:700;">{{from_name}}</td>
                </tr>
                <tr>
                  <td style="padding:13px 16px; border-bottom:1px solid #e8edf5; color:#667085; font-size:13px;">E-mail</td>
                  <td style="padding:13px 16px; border-bottom:1px solid #e8edf5; font-size:14px;"><a href="mailto:{{from_email}}" style="color:#246cf0; text-decoration:none; font-weight:700;">{{from_email}}</a></td>
                </tr>
                <tr>
                  <td style="padding:13px 16px; color:#667085; font-size:13px;">Projekt</td>
                  <td style="padding:13px 16px; color:#172033; font-size:14px; font-weight:700;">{{project_label}}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 30px 8px;">
              <p style="margin:0 0 8px; color:#667085; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;">Üzenet</p>
              <div style="padding:17px 18px; background:#f7f9fc; border-left:4px solid #246cf0; border-radius:7px; color:#172033; font-size:15px; line-height:1.65; white-space:pre-wrap;">{{message}}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:22px 30px 30px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td bgcolor="#246cf0" style="border-radius:9px;">
                    <a href="mailto:{{from_email}}?subject=Re%3A%20CodeNest%20megkeres%C3%A9s" style="display:inline-block; padding:13px 20px; color:#ffffff; font-size:14px; font-weight:700; text-decoration:none;">Válasz az érdeklődőnek</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 30px; background:#edf3ff; color:#667085; font-size:12px; line-height:1.5;">Ezt az értesítést a codenest.hu kapcsolatfelvételi űrlapja küldte.</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
